<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fraction Strips - MagicBox</title>
  <style>
    body { font-family: sans-serif; background: #f8fafc; padding: 2rem 1rem; text-align: center; }
    .back { display: inline-block; margin-bottom: 1.5rem; text-decoration: none; color: #4285F4; font-weight: bold; }
    .strip-container { max-width: 600px; margin: 1rem auto; display: flex; border: 2px solid #334155; border-radius: 8px; overflow: hidden; height: 60px; }
    .part { flex: 1; display: flex; align-items: center; justify-content: center; background: #93c5fd; border-right: 1px solid #334155; font-size: 1.2rem; font-weight: bold; cursor: pointer; user-select: none; }
    .part:last-child { border-right: none; }
    .part.active { background: #3b82f6; color: white; }
    .controls { margin-top: 1.5rem; }
    button { padding: 0.6rem 1rem; font-size: 1rem; margin: 0 0.25rem; border-radius: 8px; border: 1px solid #cbd5e1; cursor: pointer; }
  </style>
</head>
<body>
  <a href="../index.html" class="back">&larr; Back to MagicBox</a>
  <h2>Fraction Strips Visualizer</h2>
  <p>Click parts to shade them. Count the shaded parts to find the fraction.</p>

  <div class="strip-container" id="strip"></div>
  <h3 id="fractionDisplay">Selected: 0 / 4</h3>

  <div class="controls">
    <button onclick="changeDenom(2)">Halves (1/2)</button>
    <button onclick="changeDenom(3)">Thirds (1/3)</button>
    <button onclick="changeDenom(4)">Fourths (1/4)</button>
    <button onclick="changeDenom(6)">Sixths (1/6)</button>
  </div>

  <script>
    let denom = 4;
    function render() {
      const box = document.getElementById('strip');
      box.innerHTML = '';
      for (let i = 0; i < denom; i++) {
        const d = document.createElement('div');
        d.className = 'part';
        d.innerText = `1/${denom}`;
        d.onclick = () => {
          d.classList.toggle('active');
          updateCount();
        };
        box.appendChild(d);
      }
      updateCount();
    }
    function updateCount() {
      const activeCount = document.querySelectorAll('.part.active').length;
      document.getElementById('fractionDisplay').innerText = `Selected: ${activeCount} / ${denom}`;
    }
    function changeDenom(n) { denom = n; render(); }
    render();
  </script>
</body>
</html>
