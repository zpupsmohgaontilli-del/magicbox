<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>प्रकाशाचे परावर्तन (Reflection of Light) — MagicBox</title>

  <!-- Google Fonts: Devanagari & Modern UI Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <style>
    :root {
      --bg: #000000;
      --panel-bg: rgba(15, 23, 42, 0.88);
      --border: rgba(255, 255, 255, 0.12);
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* Fixed Viewport: Exactly 100vh / 100dvh to prevent any scrolling */
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: 'Noto Sans Devanagari', 'Poppins', sans-serif;
      display: flex;
      flex-direction: column;
    }

    /* Compact Top Header */
    header {
      height: 48px;
      min-height: 48px;
      padding: 0 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.95);
      border-bottom: 1px solid var(--border);
      z-index: 20;
    }

    .btn-back {
      text-decoration: none;
      color: var(--accent);
      font-size: 0.88rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(255, 255, 255, 0.06);
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      transition: all 0.2s ease;
    }
    .btn-back:hover {
      background: rgba(255, 255, 255, 0.14);
      transform: translateX(-2px);
    }

    .title-banner {
      font-size: 0.92rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.45rem;
      color: #e2e8f0;
    }

    /* Interactive Canvas Stage */
    .stage {
      flex: 1;
      position: relative;
      width: 100%;
      min-height: 0; /* Critical for flex child shrink */
      overflow: hidden;
      touch-action: none; /* Prevents mobile browser scrolling while dragging */
    }

    #opticsCanvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
    }

    /* Live Heads-Up Display (HUD) */
    .hud-badge {
      position: absolute;
      top: 10px;
      left: 12px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border);
      padding: 0.45rem 0.75rem;
      border-radius: 10px;
      font-size: 0.8rem;
      line-height: 1.45;
      pointer-events: none;
      backdrop-filter: blur(8px);
      z-index: 10;
    }
    .hud-badge b { color: var(--accent); }

    /* Compact Bottom Control Station */
    .dock {
      background: var(--panel-bg);
      border-top: 1px solid var(--border);
      backdrop-filter: blur(12px);
      padding: 0.5rem 1rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-around;
      gap: 0.75rem 1.25rem;
      z-index: 20;
    }

    .dock-group {
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }

    .dock-label {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--muted);
      white-space: nowrap;
    }

    /* Surface Switch Buttons */
    .surface-toggles {
      display: flex;
      gap: 0.35rem;
      background: rgba(0, 0, 0, 0.4);
      padding: 3px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .btn-toggle {
      padding: 0.35rem 0.7rem;
      font-size: 0.78rem;
      font-family: inherit;
      font-weight: 600;
      border-radius: 7px;
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.35rem;
      transition: all 0.2s ease;
    }

    .btn-toggle.active {
      background: #2563eb;
      color: #ffffff;
      box-shadow: 0 0 10px rgba(37, 99, 235, 0.5);
    }

    /* Laser Count Slider */
    .slider-wrap {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    input[type="range"] {
      width: 85px;
      accent-color: #38bdf8;
      cursor: pointer;
      height: 5px;
      border-radius: 3px;
    }

    .count-indicator {
      font-weight: 700;
      color: var(--accent);
      min-width: 14px;
      font-size: 0.88rem;
      text-align: center;
    }

    /* Color Swatches */
    .color-swatches {
      display: flex;
      gap: 0.45rem;
      align-items: center;
    }

    .color-dot {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform 0.15s ease;
    }

    .color-dot:hover { transform: scale(1.15); }
    .color-dot.active {
      border-color: #ffffff;
      transform: scale(1.22);
    }

    /* Small screen optimizations */
    @media (max-width: 650px) {
      header { height: 42px; min-height: 42px; padding: 0 0.75rem; }
      .title-banner { font-size: 0.82rem; }
      .dock {
        padding: 0.45rem 0.65rem;
        justify-content: space-between;
        gap: 0.4rem;
      }
      .dock-label { display: none; } /* Hide labels on tight mobile screens to save space */
      input[type="range"] { width: 70px; }
      .hud-badge { font-size: 0.72rem; padding: 0.35rem 0.55rem; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <a href="../index.html" class="btn-back">
      <i class="fa-solid fa-arrow-left"></i> MagicBox
    </a>
    <div class="title-banner">
      <i class="fa-solid fa-lightbulb" style="color: #facc15;"></i>
      <span>प्रकाशाचे परावर्तन (Optics Lab)</span>
    </div>
  </header>

  <!-- Canvas Stage (Zero overflow, zero scroll) -->
  <div class="stage" id="stageContainer">
    <div class="hud-badge">
      पृष्ठभाग: <b id="hudSurface">गुळगुळीत (Smooth)</b><br>
      आपाती कोन ($i$): <b id="hudAngle">४५°</b>
    </div>
    <canvas id="opticsCanvas"></canvas>
  </div>

  <!-- Bottom Control Dock -->
  <footer class="dock">
    <!-- Surface Toggle -->
    <div class="dock-group">
      <span class="dock-label">पृष्ठभाग:</span>
      <div class="surface-toggles">
        <button class="btn-toggle active" id="btnSmooth" onclick="setSurface('smooth')">
          <i class="fa-solid fa-grip-lines"></i> गुळगुळीत
        </button>
        <button class="btn-toggle" id="btnRough" onclick="setSurface('rough')">
          <i class="fa-solid fa-mountain"></i> खडबडीत
        </button>
      </div>
    </div>

    <!-- Beam Count -->
    <div class="dock-group">
      <span class="dock-label">किरण:</span>
      <div class="slider-wrap">
        <input type="range" id="laserSlider" min="1" max="5" value="3" step="1" oninput="setLaserCount(this.value)">
        <span class="count-indicator" id="hudCount">३</span>
      </div>
    </div>

    <!-- Beam Color Swatches -->
    <div class="dock-group">
      <span class="dock-label">रंग:</span>
      <div class="color-swatches">
        <div class="color-dot active" style="background: #00ff66; box-shadow: 0 0 8px #00ff66;" onclick="setColor('#00ff66', this)"></div>
        <div class="color-dot" style="background: #ff0055; box-shadow: 0 0 8px #ff0055;" onclick="setColor('#ff0055', this)"></div>
        <div class="color-dot" style="background: #00e5ff; box-shadow: 0 0 8px #00e5ff;" onclick="setColor('#00e5ff', this)"></div>
        <div class="color-dot" style="background: #ffe600; box-shadow: 0 0 8px #ffe600;" onclick="setColor('#ffe600', this)"></div>
        <div class="color-dot" style="background: #c084fc; box-shadow: 0 0 8px #c084fc;" onclick="setColor('#c084fc', this)"></div>
      </div>
    </div>
  </footer>

  <script>
    const stage = document.getElementById('stageContainer');
    const canvas = document.getElementById('opticsCanvas');
    const ctx = canvas.getContext('2d');

    const marathiDigits = ['०', '१', '२', '३', '४', '५', '६', '७', '८', '९'];
    function toMarathi(n) {
      return n.toString().split('').map(c => marathiDigits[parseInt(c)] || c).join('');
    }

    // App State
    let surfaceType = 'smooth';
    let beamColor = '#00ff66';
    let laserCount = 3;
    let isDragging = false;
    let sourcePos = { x: 0, y: 0 };
    let roughFacets = [];

    // Precise Canvas Resizing without triggering scroll
    function resize() {
      const w = stage.clientWidth;
      const h = stage.clientHeight;
      const dpr = window.devicePixelRatio || 1;

      canvas.width = w * dpr;
      canvas.height = h * dpr;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.scale(dpr, dpr);

      // Default torch position (centered horizontally, upper third)
      if (sourcePos.x === 0 && sourcePos.y === 0) {
        sourcePos.x = w * 0.25;
        sourcePos.y = h * 0.22;
      } else {
        // Keep torch in bounds on screen orientation change
        sourcePos.x = Math.min(sourcePos.x, w - 40);
        sourcePos.y = Math.min(sourcePos.y, h * 0.55);
      }

      generateRoughFacets(w);
      draw();
    }

    function generateRoughFacets(w) {
      roughFacets = [];
      const step = 8;
      for (let x = 0; x <= w + step; x += step) {
        const offset = Math.sin(x * 0.14) * 4 + Math.cos(x * 0.38) * 6 + ((x % 13) - 6) * 0.7;
        roughFacets.push({ x: x, y: offset });
      }
    }

    window.addEventListener('resize', resize);
    window.addEventListener('orientationchange', resize);

    // Controls
    function setSurface(type) {
      surfaceType = type;
      document.getElementById('btnSmooth').classList.toggle('active', type === 'smooth');
      document.getElementById('btnRough').classList.toggle('active', type === 'rough');
      document.getElementById('hudSurface').innerText = (type === 'smooth') ? 'गुळगुळीत (नियमित)' : 'खडबडीत (विखुरलेले)';
      draw();
    }

    function setColor(hex, el) {
      beamColor = hex;
      document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
      el.classList.add('active');
      draw();
    }

    function setLaserCount(val) {
      laserCount = parseInt(val);
      document.getElementById('hudCount').innerText = toMarathi(laserCount);
      draw();
    }

    // Touch & Pointer Dragging
    function getPointerPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: clientX - rect.left,
        y: clientY - rect.top
      };
    }

    function onPointerDown(e) {
      const p = getPointerPos(e);
      const mirrorY = stage.clientHeight * 0.7;
      if (p.y < mirrorY - 15) {
        isDragging = true;
        sourcePos.x = p.x;
        sourcePos.y = p.y;
        draw();
      }
    }

    function onPointerMove(e) {
      if (!isDragging) return;
      const p = getPointerPos(e);
      const mirrorY = stage.clientHeight * 0.7;
      sourcePos.x = Math.max(30, Math.min(stage.clientWidth - 30, p.x));
      sourcePos.y = Math.max(25, Math.min(mirrorY - 35, p.y));
      draw();
    }

    function onPointerUp() { isDragging = false; }

    stage.addEventListener('mousedown', onPointerDown);
    window.addEventListener('mousemove', onPointerMove);
    window.addEventListener('mouseup', onPointerUp);

    stage.addEventListener('touchstart', onPointerDown, { passive: false });
    window.addEventListener('touchmove', onPointerMove, { passive: false });
    window.addEventListener('touchend', onPointerUp);

    // Glowing Neon Line Drawing
    function drawNeonLine(x1, y1, x2, y2, color, width = 3) {
      ctx.save();
      // Outer glow
      ctx.strokeStyle = color;
      ctx.lineWidth = width + 6;
      ctx.shadowColor = color;
      ctx.shadowBlur = 14;
      ctx.globalAlpha = 0.28;
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();

      // Sharp Core
      ctx.lineWidth = width;
      ctx.globalAlpha = 0.85;
      ctx.stroke();

      // White Center Filament
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = Math.max(1.2, width * 0.45);
      ctx.shadowBlur = 3;
      ctx.globalAlpha = 0.95;
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
      ctx.restore();
    }

    // Main Render Loop
    function draw() {
      const w = stage.clientWidth;
      const h = stage.clientHeight;
      const mirrorY = h * 0.7;

      ctx.clearRect(0, 0, w, h);

      // 1. Draw Surface (Mirror or Rough Board)
      if (surfaceType === 'smooth') {
        const grad = ctx.createLinearGradient(0, mirrorY, 0, h);
        grad.addColorStop(0, 'rgba(56, 189, 248, 0.35)');
        grad.addColorStop(0.12, 'rgba(15, 23, 42, 0.95)');
        grad.addColorStop(1, '#020617');

        ctx.fillStyle = grad;
        ctx.fillRect(0, mirrorY, w, h - mirrorY);

        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 2.5;
        ctx.shadowColor = '#0284c7';
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.moveTo(0, mirrorY);
        ctx.lineTo(w, mirrorY);
        ctx.stroke();
        ctx.shadowBlur = 0;
      } else {
        ctx.save();
        ctx.fillStyle = '#1e293b';
        ctx.beginPath();
        ctx.moveTo(0, mirrorY + (roughFacets[0]?.y || 0));
        for (let i = 1; i < roughFacets.length; i++) {
          ctx.lineTo(roughFacets[i].x, mirrorY + roughFacets[i].y);
        }
        ctx.lineTo(w, h);
        ctx.lineTo(0, h);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = '#94a3b8';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, mirrorY + (roughFacets[0]?.y || 0));
        for (let i = 1; i < roughFacets.length; i++) {
          ctx.lineTo(roughFacets[i].x, mirrorY + roughFacets[i].y);
        }
        ctx.stroke();
        ctx.restore();
      }

      // 2. Normal (स्तंभिका)
      const targetCenterX = w * 0.52;
      ctx.save();
      ctx.setLineDash([4, 4]);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(targetCenterX, mirrorY - (h * 0.4));
      ctx.lineTo(targetCenterX, mirrorY);
      ctx.stroke();
      ctx.restore();

      // 3. Angle Calculation
      const dx = targetCenterX - sourcePos.x;
      const dy = mirrorY - sourcePos.y;
      const angleDeg = Math.round(Math.abs(Math.atan2(dx, dy) * (180 / Math.PI)));
      document.getElementById('hudAngle').innerText = `${toMarathi(angleDeg)}°`;

      // 4. Draw Neon Lasers
      const beamSpacing = Math.min(22, w * 0.04);
      const startOffset = -((laserCount - 1) / 2) * beamSpacing;

      for (let i = 0; i < laserCount; i++) {
        const offset = startOffset + (i * beamSpacing);
        const startX = sourcePos.x + offset;
        const startY = sourcePos.y;
        const hitX = targetCenterX + offset;
        const hitY = mirrorY;

        // Incident Ray
        drawNeonLine(startX, startY, hitX, hitY, beamColor, 2.5);

        // Flash dot
        ctx.save();
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = beamColor;
        ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.arc(hitX, hitY, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // Reflected Ray
        if (surfaceType === 'smooth') {
          const rayDx = hitX - startX;
          const rayDy = hitY - startY;
          drawNeonLine(hitX, hitY, hitX + rayDx, hitY - rayDy, beamColor, 2.5);
        } else {
          // Diffused scattered angles
          const angles = [-62, 38, -22, 54, -48];
          const theta = (angles[i % angles.length] * Math.PI) / 180;
          const rayLen = Math.min(260, h * 0.5);
          drawNeonLine(hitX, hitY, hitX + Math.sin(theta) * rayLen, hitY - Math.cos(theta) * rayLen, beamColor, 2.2);
        }
      }

      // 5. Draw Laser Torch Body
      ctx.save();
      ctx.fillStyle = '#0f172a';
      ctx.strokeStyle = beamColor;
      ctx.lineWidth = 1.8;
      ctx.shadowColor = beamColor;
      ctx.shadowBlur = 10;

      const torchW = Math.max(48, (laserCount * beamSpacing) + 14);
      ctx.beginPath();
      ctx.roundRect(sourcePos.x - torchW / 2, sourcePos.y - 18, torchW, 20, 5);
      ctx.fill();
      ctx.stroke();

      // Emitter dots
      for (let i = 0; i < laserCount; i++) {
        const offset = startOffset + (i * beamSpacing);
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(sourcePos.x + offset, sourcePos.y + 2, 2.5, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();

      // Instructional touch hint
      ctx.save();
      ctx.font = '11px Poppins, Noto Sans Devanagari';
      ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
      ctx.textAlign = 'center';
      ctx.fillText('लेसर हलवण्यासाठी वर कुठेही स्पर्श करा (Drag Laser)', sourcePos.x, sourcePos.y - 24);
      ctx.restore();
    }

    // Launch immediately on load
    window.addEventListener('DOMContentLoaded', resize);
  </script>
</body>
</html>
