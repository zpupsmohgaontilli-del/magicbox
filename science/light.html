<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>प्रकाशाचे परावर्तन (Reflection of Light) — MagicBox</title>

  <!-- Clean Devanagari & Modern Sans Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <style>
    :root {
      --bg: #090a0f;
      --panel-bg: rgba(18, 22, 34, 0.85);
      --border: rgba(255, 255, 255, 0.12);
      --text: #f1f5f9;
      --muted: #94a3b8;
      --laser-color: #00ff66;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Noto Sans Devanagari', 'Poppins', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Top Navigation */
    header {
      padding: 0.85rem 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 17, 26, 0.8);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      z-index: 10;
    }

    .btn-back {
      text-decoration: none;
      color: #60a5fa;
      font-size: 0.95rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(255, 255, 255, 0.05);
      padding: 0.45rem 0.9rem;
      border-radius: 9999px;
      border: 1px solid var(--border);
      transition: all 0.2s ease;
    }
    .btn-back:hover {
      background: rgba(255, 255, 255, 0.12);
      transform: translateX(-3px);
    }

    .title-banner {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    /* Simulation Layout */
    .workbench {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Interactive Canvas */
    #opticsCanvas {
      width: 100%;
      flex: 1;
      min-height: 380px;
      background: #000000;
      display: block;
      cursor: crosshair;
    }

    /* Controls Panel */
    .controls-panel {
      background: var(--panel-bg);
      border-top: 1px solid var(--border);
      backdrop-filter: blur(12px);
      padding: 1rem 1.25rem;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.2rem;
      z-index: 5;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }

    .control-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Toggle Buttons for Surfaces */
    .surface-toggles {
      display: flex;
      gap: 0.5rem;
    }

    .btn-toggle {
      flex: 1;
      padding: 0.6rem 0.75rem;
      font-size: 0.85rem;
      font-family: inherit;
      font-weight: 600;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      transition: all 0.2s ease;
    }

    .btn-toggle.active {
      background: #2563eb;
      border-color: #3b82f6;
      box-shadow: 0 0 12px rgba(59, 130, 246, 0.5);
    }

    /* Color Swatches */
    .color-swatches {
      display: flex;
      gap: 0.6rem;
      align-items: center;
    }

    .color-dot {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .color-dot:hover {
      transform: scale(1.15);
    }

    .color-dot.active {
      border-color: #ffffff;
      transform: scale(1.18);
    }

    /* Slider Range */
    input[type="range"] {
      width: 100%;
      accent-color: #3b82f6;
      cursor: pointer;
      height: 6px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 3px;
    }

    /* Angle & State Readout Overlay */
    .hud-badge {
      position: absolute;
      top: 15px;
      left: 15px;
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid var(--border);
      padding: 0.6rem 0.9rem;
      border-radius: 10px;
      font-size: 0.85rem;
      line-height: 1.4;
      pointer-events: none;
      backdrop-filter: blur(8px);
    }

    .hud-badge span {
      color: #60a5fa;
      font-weight: 700;
    }

    @media (max-width: 600px) {
      .controls-panel {
        grid-template-columns: 1fr;
        gap: 0.9rem;
        padding: 0.85rem 1rem;
      }
      .title-banner {
        font-size: 0.95rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <a href="../index.html" class="btn-back">
      <i class="fa-solid fa-arrow-left"></i> MagicBox
    </a>
    <div class="title-banner">
      <i class="fa-solid fa-lightbulb" style="color: #facc15; margin-right: 6px;"></i>
      प्रकाशाचे परावर्तन प्रयोगशाळा (Light Optics Lab)
    </div>
  </header>

  <div class="workbench">
    <div class="hud-badge">
      पृष्ठभाग: <span id="surfaceModeText">गुळगुळीत आरसा (Smooth Mirror)</span><br>
      आपाती कोन ($i$): <span id="incidentAngleText">४५°</span>
    </div>

    <canvas id="opticsCanvas"></canvas>

    <!-- Control Station -->
    <div class="controls-panel">
      <!-- Surface Type Selection -->
      <div class="control-group">
        <label class="control-label">पृष्ठभागाचा प्रकार (Surface Type)</label>
        <div class="surface-toggles">
          <button class="btn-toggle active" id="btnSmooth" onclick="setSurface('smooth')">
            <i class="fa-solid fa-grip-lines"></i> गुळगुळीत (Smooth)
          </button>
          <button class="btn-toggle" id="btnRough" onclick="setSurface('rough')">
            <i class="fa-solid fa-mountain"></i> खडबडीत (Rough)
          </button>
        </div>
      </div>

      <!-- Laser Count -->
      <div class="control-group">
        <label class="control-label">
          <span>लेसर किरणांची संख्या (Lasers)</span>
          <span id="laserCountVal" style="color:#60a5fa; font-weight:700;">3</span>
        </label>
        <input type="range" id="laserCountSlider" min="1" max="5" value="3" step="1" oninput="updateLaserCount(this.value)">
      </div>

      <!-- Laser Beam Color -->
      <div class="control-group">
        <label class="control-label">किरणांचा रंग (Neon Beam Color)</label>
        <div class="color-swatches">
          <div class="color-dot active" style="background: #00ff66; box-shadow: 0 0 10px #00ff66;" onclick="setColor('#00ff66', this)"></div>
          <div class="color-dot" style="background: #ff0055; box-shadow: 0 0 10px #ff0055;" onclick="setColor('#ff0055', this)"></div>
          <div class="color-dot" style="background: #00e5ff; box-shadow: 0 0 10px #00e5ff;" onclick="setColor('#00e5ff', this)"></div>
          <div class="color-dot" style="background: #ffe600; box-shadow: 0 0 10px #ffe600;" onclick="setColor('#ffe600', this)"></div>
          <div class="color-dot" style="background: #b537f2; box-shadow: 0 0 10px #b537f2;" onclick="setColor('#b537f2', this)"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('opticsCanvas');
    const ctx = canvas.getContext('2d');

    // Marathi Digits Mapper
    const marathiDigits = ['०', '१', '२', '३', '४', '५', '६', '७', '८', '९'];
    function toMarathiNumber(num) {
      return num.toString().split('').map(c => marathiDigits[parseInt(c)] || c).join('');
    }

    // App State
    let surfaceType = 'smooth'; // 'smooth' or 'rough'
    let beamColor = '#00ff66';
    let laserCount = 3;
    let isDragging = false;

    // Laser Source Origin (draggable in canvas space)
    let sourcePos = { x: 120, y: 120 };

    // Rough Surface Micro-facets
    let roughSurfacePoints = [];

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * window.devicePixelRatio;
      canvas.height = rect.height * window.devicePixelRatio;
      ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
      generateRoughSurface();
      draw();
    }

    window.addEventListener('resize', resizeCanvas);

    function generateRoughSurface() {
      roughSurfacePoints = [];
      const w = canvas.getBoundingClientRect().width;
      const step = 8;
      for (let x = 0; x <= w; x += step) {
        // Fixed seed-like procedural jagged surface
        const offset = Math.sin(x * 0.12) * 4 + Math.cos(x * 0.35) * 6 + ((x % 17) - 8) * 0.6;
        roughSurfacePoints.push({ x: x, y: offset });
      }
    }

    function setSurface(type) {
      surfaceType = type;
      document.getElementById('btnSmooth').classList.toggle('active', type === 'smooth');
      document.getElementById('btnRough').classList.toggle('active', type === 'rough');
      document.getElementById('surfaceModeText').innerText = 
        type === 'smooth' ? 'गुळगुळीत आरसा (नियमित परावर्तन)' : 'खडबडीत पृष्ठभाग (अनियमित / विखुरलेले परावर्तन)';
      draw();
    }

    function setColor(hex, el) {
      beamColor = hex;
      document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
      el.classList.add('active');
      draw();
    }

    function updateLaserCount(val) {
      laserCount = parseInt(val);
      document.getElementById('laserCountVal').innerText = toMarathiNumber(laserCount);
      draw();
    }

    // Mouse / Touch Interaction for moving the laser torch
    function getEventPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: clientX - rect.left,
        y: clientY - rect.top
      };
    }

    function handleStart(e) {
      const p = getEventPos(e);
      // Can drag from anywhere above the mirror
      const mirrorY = canvas.getBoundingClientRect().height * 0.68;
      if (p.y < mirrorY - 20) {
        isDragging = true;
        sourcePos = p;
        draw();
      }
    }

    function handleMove(e) {
      if (!isDragging) return;
      const p = getEventPos(e);
      const mirrorY = canvas.getBoundingClientRect().height * 0.68;
      sourcePos.x = Math.max(30, Math.min(canvas.getBoundingClientRect().width - 30, p.x));
      sourcePos.y = Math.max(30, Math.min(mirrorY - 40, p.y));
      draw();
    }

    function handleEnd() { isDragging = false; }

    canvas.addEventListener('mousedown', handleStart);
    canvas.addEventListener('mousemove', handleMove);
    window.addEventListener('mouseup', handleEnd);

    canvas.addEventListener('touchstart', handleStart, { passive: true });
    canvas.addEventListener('touchmove', handleMove, { passive: true });
    window.addEventListener('touchend', handleEnd);

    // Neon Glow Line Drawing Helper
    function drawNeonLine(x1, y1, x2, y2, color, width = 3) {
      ctx.save();
      // Outermost wide glow
      ctx.strokeStyle = color;
      ctx.lineWidth = width + 7;
      ctx.shadowColor = color;
      ctx.shadowBlur = 18;
      ctx.globalAlpha = 0.28;
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();

      // Sharp inner beam
      ctx.lineWidth = width + 2;
      ctx.shadowBlur = 10;
      ctx.globalAlpha = 0.8;
      ctx.stroke();

      // Super-bright white core
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = Math.max(1.5, width * 0.55);
      ctx.shadowBlur = 4;
      ctx.globalAlpha = 0.95;
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
      ctx.restore();
    }

    function draw() {
      const rect = canvas.getBoundingClientRect();
      const w = rect.width;
      const h = rect.height;
      const mirrorY = h * 0.68;

      ctx.clearRect(0, 0, w, h);

      // 1. Draw Mirror / Reflective Surface
      if (surfaceType === 'smooth') {
        // Smooth silver mirror
        const grad = ctx.createLinearGradient(0, mirrorY, 0, h);
        grad.addColorStop(0, 'rgba(56, 189, 248, 0.45)');
        grad.addColorStop(0.08, 'rgba(15, 23, 42, 0.95)');
        grad.addColorStop(1, '#020617');

        ctx.fillStyle = grad;
        ctx.fillRect(0, mirrorY, w, h - mirrorY);

        // Mirror surface reflective boundary
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 3;
        ctx.shadowColor = '#0284c7';
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.moveTo(0, mirrorY);
        ctx.lineTo(w, mirrorY);
        ctx.stroke();
        ctx.shadowBlur = 0;
      } else {
        // Rough irregular boundary
        ctx.save();
        ctx.fillStyle = '#1e293b';
        ctx.beginPath();
        ctx.moveTo(0, mirrorY + (roughSurfacePoints[0]?.y || 0));
        for (let i = 1; i < roughSurfacePoints.length; i++) {
          ctx.lineTo(roughSurfacePoints[i].x, mirrorY + roughSurfacePoints[i].y);
        }
        ctx.lineTo(w, h);
        ctx.lineTo(0, h);
        ctx.closePath();
        ctx.fill();

        // Jagged boundary line
        ctx.strokeStyle = '#94a3b8';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(0, mirrorY + (roughSurfacePoints[0]?.y || 0));
        for (let i = 1; i < roughSurfacePoints.length; i++) {
          ctx.lineTo(roughSurfacePoints[i].x, mirrorY + roughSurfacePoints[i].y);
        }
        ctx.stroke();
        ctx.restore();
      }

      // 2. Normal (स्तंभिका) for center reference
      const targetCenterX = w * 0.52;
      ctx.save();
      ctx.setLineDash([5, 5]);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(targetCenterX, mirrorY - 140);
      ctx.lineTo(targetCenterX, mirrorY);
      ctx.stroke();
      ctx.restore();

      // 3. Compute Angle for Angle HUD
      const dxNorm = targetCenterX - sourcePos.x;
      const dyNorm = mirrorY - sourcePos.y;
      let incidentAngleDeg = Math.round(Math.abs(Math.atan2(dxNorm, dyNorm) * (180 / Math.PI)));
      document.getElementById('incidentAngleText').innerText = `${toMarathiNumber(incidentAngleDeg)}°`;

      // 4. Generate Up to 5 Laser Beams
      const beamSpacing = 24;
      const startOffset = -((laserCount - 1) / 2) * beamSpacing;

      for (let i = 0; i < laserCount; i++) {
        const offset = startOffset + (i * beamSpacing);
        const startX = sourcePos.x + offset;
        const startY = sourcePos.y;
        const hitX = targetCenterX + offset;
        const hitY = mirrorY;

        // Incident Ray (आपाती किरण)
        drawNeonLine(startX, startY, hitX, hitY, beamColor, 2.5);

        // Reflection Point Flash (स्पर्श बिंदू)
        ctx.save();
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = beamColor;
        ctx.shadowBlur = 14;
        ctx.beginPath();
        ctx.arc(hitX, hitY, 3.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // Reflected Ray (परावर्तित किरण)
        if (surfaceType === 'smooth') {
          // Regular Reflection: Angle of incidence = Angle of reflection
          const rayDx = hitX - startX;
          const rayDy = hitY - startY;
          const reflEndX = hitX + rayDx;
          const reflEndY = hitY - rayDy;
          drawNeonLine(hitX, hitY, reflEndX, reflEndY, beamColor, 2.5);
        } else {
          // Diffused Reflection: Every beam scatters at erratic pseudorandom angles
          const scatterAngles = [-65, 35, -20, 50, -45];
          const chosenAngle = (scatterAngles[i % scatterAngles.length] * Math.PI) / 180;
          const rayLength = 260;
          const reflEndX = hitX + Math.sin(chosenAngle) * rayLength;
          const reflEndY = hitY - Math.cos(chosenAngle) * rayLength;
          drawNeonLine(hitX, hitY, reflEndX, reflEndY, beamColor, 2.2);
        }
      }

      // 5. Draw Laser Torch Housing (Source)
      ctx.save();
      ctx.fillStyle = '#1e293b';
      ctx.strokeStyle = beamColor;
      ctx.lineWidth = 2;
      ctx.shadowColor = beamColor;
      ctx.shadowBlur = 12;

      const torchWidth = Math.max(50, (laserCount * beamSpacing) + 16);
      ctx.beginPath();
      ctx.roundRect(sourcePos.x - torchWidth / 2, sourcePos.y - 20, torchWidth, 24, 6);
      ctx.fill();
      ctx.stroke();

      // Torch Lens Emitters
      for (let i = 0; i < laserCount; i++) {
        const offset = startOffset + (i * beamSpacing);
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(sourcePos.x + offset, sourcePos.y + 4, 3, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();

      // Guide label for teachers/students
      ctx.save();
      ctx.font = '12px Poppins, Noto Sans Devanagari';
      ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
      ctx.textAlign = 'center';
      ctx.fillText('लेसर हलवण्यासाठी वर कुठेही स्पर्श करा / ड्रॅग करा (Drag Laser)', sourcePos.x, sourcePos.y - 28);
      ctx.restore();
    }

    // Initial setup on load
    window.onload = () => {
      resizeCanvas();
    };
  </script>
</body>
</html>
